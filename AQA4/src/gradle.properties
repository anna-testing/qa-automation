# Общие настройки Gradle для всего проекта.
# Для пользователей IDE (например, Android Studio):
# настройки Gradle, заданные через IDE, *переопределяют*
# значения, указанные в этом файле.
# Подробнее о настройке среды сборки:
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Аргументы JVM, используемые процессом Gradle Daemon.
# Параметр особенно полезен для настройки объёма памяти.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Если включить этот параметр, Gradle будет работать в экспериментальном параллельном режиме.
# Параметр следует использовать только для независимых проектов. Подробнее:
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Структура пакетов AndroidX позволяет отличить библиотеки операционной системы Android
# от библиотек, включённых в APK приложения.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Стиль кода Kotlin в проекте: "official" или "obsolete".
kotlin.code.style=official
# Включает отдельное пространство имён для класса R каждой библиотеки.
# Благодаря этому класс R содержит только ресурсы самой библиотеки, без ресурсов
# её зависимостей, что уменьшает размер класса R.
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
